<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqvBjy4JDwWC5tIdUzwk7eoazZUw7I7f0&libraries=places&callback=initAutocomplete"
  async
  defer
></script>
<script>
  const autocompletes = [];

  function initAutocomplete() {
    const addressInputs = document.querySelectorAll('input[id^="address"]');

    addressInputs.forEach(input => {
      const suffix = input.id.replace("address", ""); // "", "2", "3"

      const autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["address"],
        componentRestrictions: { country: ["ca", "us"] }
      });

      autocomplete.addListener("place_changed", () => {
        fillInAddress(autocomplete, suffix);
      });

      autocompletes.push(autocomplete);
    });
  }

  function fillInAddress(autocomplete, suffix) {
    const place = autocomplete.getPlace();
    if (!place.address_components) return;

    let street = "";
    let city = "";
    let postalCode = "";
    let country = "";

    place.address_components.forEach(component => {
      const types = component.types;

      if (types.includes("street_number")) street = component.long_name + " ";
      if (types.includes("route")) street += component.long_name;
      if (types.includes("locality")) city = component.long_name;
      if (types.includes("postal_code")) postalCode = component.long_name;
      if (types.includes("country")) country = component.short_name; // CA / US
    });

    const setValue = (id, value) => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    };

    setValue(`address${suffix}`, street.trim());
    setValue(`city${suffix}`, city);
    setValue(`postalCode${suffix}`, postalCode);
    setValue(`country${suffix}`, country);
  }
</script></body></html>
